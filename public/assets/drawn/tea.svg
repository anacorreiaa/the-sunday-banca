<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="600" height="840">
  <defs>
    <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0" result="gg"/>
      <feComposite in="gg" in2="d" operator="in" result="grain"/>
      <feComponentTransfer in="grain" result="lg"><feFuncA type="linear" slope=".35"/></feComponentTransfer><feBlend in="d" in2="lg" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <radialGradient id="bagg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fbf6ea"/><stop offset=".7" stop-color="#efe3cb"/><stop offset="1" stop-color="#e2d1b0"/>
    </radialGradient>
    <radialGradient id="tea" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#b8875a" stop-opacity=".45"/><stop offset="1" stop-color="#9a7448" stop-opacity=".18"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="150" cy="398" rx="88" ry="10" fill="#3b2a20" opacity=".12" filter="url(#soft)"/>
  <g filter="url(#wc)" transform="rotate(-7 150 250)">
    <!-- string -->
    <path d="M150 168 C 146 130, 160 100, 152 62" stroke="#cdbb98" stroke-width="2" fill="none"/>
    <!-- tag -->
    <g transform="rotate(6 152 46)">
      <rect x="112" y="16" width="80" height="58" rx="3" fill="#9a2f2c"/>
      <rect x="117" y="21" width="70" height="48" rx="2" fill="none" stroke="#f4e6cf" stroke-width="1" opacity=".55"/>
      <path d="M128 45 h 48" stroke="#f4e6cf" stroke-width="1.2" opacity=".6"/>
    </g>
    <!-- bag body -->
    <path d="M86 186 Q 84 176 96 174 L 204 174 Q 216 176 214 186 L 220 372 Q 220 388 204 388 L 96 388 Q 80 388 80 372 Z" fill="url(#bagg)" stroke="#cdb894" stroke-width="1.4"/>
    <!-- folded top -->
    <path d="M92 174 L 208 174 L 210 204 L 90 204 Z" fill="#eadbbd" stroke="#cdb894" stroke-width="1"/>
    <rect x="140" y="183" width="20" height="5" rx="1" fill="#a9a399"/>
    <!-- tea inside -->
    <path d="M100 228 Q 150 214 200 228 L 202 360 Q 150 372 98 360 Z" fill="url(#tea)"/>
    <g fill="#6f5532" opacity=".55">
      <circle cx="118" cy="300" r="2.4"/><circle cx="140" cy="330" r="2"/><circle cx="170" cy="312" r="2.6"/><circle cx="186" cy="344" r="2"/><circle cx="128" cy="346" r="2.2"/><circle cx="158" cy="350" r="1.8"/><circle cx="182" cy="280" r="1.6"/><circle cx="112" cy="262" r="1.6"/>
    </g>
    <g fill="#6d7a45" opacity=".45">
      <circle cx="132" cy="284" r="2"/><circle cx="162" cy="270" r="1.8"/><circle cx="150" cy="338" r="2.2"/><circle cx="194" cy="318" r="1.8"/><circle cx="116" cy="322" r="1.6"/>
    </g>
    <!-- crimped edges -->
    <path d="M84 216 L 84 368 M 216 216 L 216 368" stroke="#d8c6a3" stroke-width="3" stroke-dasharray="2 3" fill="none"/>
    <path d="M96 382 L 204 382" stroke="#d8c6a3" stroke-width="3" stroke-dasharray="2 3"/>
  </g>
</svg>
